name: CI — video-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/video-api/**'
  pull_request:
    paths:
      - 'services/video-api/**'

jobs:
  test:
    name: lint + test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: services/video-api

      - name: Test
        working-directory: services/video-api
        run: go test ./... -count=1

      - name: Coverage
        working-directory: services/video-api
        run: |
          go test ./... -coverpkg=./internal/... -coverprofile=coverage.out -count=1 > /dev/null
          go tool cover -func=coverage.out | tail -1
