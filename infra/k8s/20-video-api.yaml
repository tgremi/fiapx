apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      containers:
        - name: video-api
          image: fiapx/video-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: POSTGRES_DB }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_PASS }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: JWT_SECRET }
            - name: VIDEO_API_PORT
              value: "8080"
            - name: STORAGE_DRIVER
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: STORAGE_DRIVER }
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_ENDPOINT }
            - name: S3_ACCESS_KEY
              value: test
            - name: S3_SECRET_KEY
              value: test
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_BUCKET }
            - name: S3_REGION
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_REGION }
            - name: REDIS_ADDR
              value: redis:6379
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
---
apiVersion: v1
kind: Service
metadata:
  name: video-api
  namespace: fiapx
spec:
  selector:
    app: video-api
  ports:
    - port: 8080
      targetPort: 8080
