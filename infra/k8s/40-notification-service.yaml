apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: fiapx/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: POSTGRES_DB }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_PASS }
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: SMTP_HOST }
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: SMTP_PORT }
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: SMTP_FROM }
            - name: METRICS_PORT
              value: "9091"
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fiapx
spec:
  selector:
    app: notification-service
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
