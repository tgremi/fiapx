apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-worker
  template:
    metadata:
      labels:
        app: processing-worker
    spec:
      containers:
        - name: processing-worker
          image: fiapx/processing-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: POSTGRES_DB }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_PASS }
            - name: STORAGE_DRIVER
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: STORAGE_DRIVER }
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_ENDPOINT }
            - name: S3_ACCESS_KEY
              value: test
            - name: S3_SECRET_KEY
              value: test
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_BUCKET }
            - name: S3_REGION
              valueFrom:
                configMapKeyRef: { name: fiapx-config, key: S3_REGION }
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/
---
apiVersion: v1
kind: Service
metadata:
  name: processing-worker
  namespace: fiapx
spec:
  selector:
    app: processing-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
